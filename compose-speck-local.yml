# n8n-table-ui (speck) — local docker-compose for dev on this Windows box
#
# Runs the UI proxy container locally and points it at the remote n8n instance
# on 10.0.0.157:5678 (same as the current local proxy-server.cjs setup). This is
# for local smoke-testing of the Docker build; production runs the server snippet
# above alongside n8n on 10.0.0.157.

services:
  n8n-table-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-table-ui-local
    restart: unless-stopped
    ports:
      - "3458:3458"
    environment:
      - NODE_ENV=production
      - PORT=3458
      - N8N_HOST=10.0.0.157          # remote n8n box (not on this Docker network)
      - N8N_PORT=5678
      - N8N_API_KEY=${N8N_API_KEY}
      - API_BASE=127.0.0.1
      - API_PORT=3456
