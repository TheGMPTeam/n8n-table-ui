name: Publish Docker image

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: thegmpteam/n8n-table-ui
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set release variables
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push immutable candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.0.0-${{ github.ref_name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            VERSION=1.0.0-${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:sha-${{ steps.vars.outputs.short_sha }}"
          docker pull "$image"
          docker run -d --name n8n-table-ui-verify -p 127.0.0.1:3458:3458 "$image"
          trap 'docker rm -f n8n-table-ui-verify >/dev/null 2>&1 || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            state="$(docker inspect n8n-table-ui-verify --format '{{.State.Status}}')"
            health="$(docker inspect n8n-table-ui-verify --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')"
            if [ "$state" != running ] || [ "$health" = unhealthy ]; then
              docker logs n8n-table-ui-verify
              exit 1
            fi
            if [ "$health" = healthy ] && curl -fsS http://127.0.0.1:3458/config >/dev/null; then
              ready=true
              break
            fi
            echo "Waiting for candidate health ($attempt/60)"
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs n8n-table-ui-verify
            exit 1
          fi
          curl -fsS http://127.0.0.1:3458/ | grep -F 'Production Command Center' >/dev/null
          echo "Verified $image at digest ${{ steps.build.outputs.digest }}"

      - name: Promote verified digest
        if: github.ref_name == 'main' || github.ref_name == 'beta'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = main ]; then
            alias_tag=latest
          else
            alias_tag=beta
          fi
          source="${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
          target="${IMAGE_NAME}:${alias_tag}"
          docker buildx imagetools create --tag "$target" "$source"
          actual="sha256:$(docker buildx imagetools inspect "$target" --raw | sha256sum | cut -d' ' -f1)"
          test "$actual" = "${{ steps.build.outputs.digest }}"
          echo "Promoted verified digest to $target"
